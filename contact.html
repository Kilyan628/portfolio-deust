<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact - Kilyan Thirard</title>

    <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-100 font-sans leading-relaxed text-slate-700">

    <header id="main-header" class="bg-slate-900 text-white">

        <div class="mx-auto flex max-w-4xl flex-col items-center gap-3 px-5 py-4 md:flex-row md:justify-between">

            <p class="font-semibold">Kilyan Thirard</p>

            <nav aria-label="Navigation principale" class="flex gap-5">

                <a href="index.html" class="hover:text-amber-400">Accueil</a>

                <a href="cv.html" class="hover:text-amber-400">CV</a>

                <a href="projets.html" class="hover:text-amber-400">Projets</a>

                <a href="contact.html" aria-current="page" class="text-amber-400">Contact</a>

            </nav>

        </div>

    </header>



    <main class="mx-auto max-w-4xl space-y-6 px-5 py-8">

        <h1 class="text-center text-3xl font-bold text-slate-900">Me contacter</h1>



        <div class="grid gap-6 md:grid-cols-2">

            <section class="rounded-xl border-l-4 border-indigo-700 bg-white p-6 shadow">

                <h2 class="border-b border-indigo-100 pb-2 text-xl font-semibold text-slate-900">📬 Formulaire</h2>

                <form action="#" method="post" class="mt-2">

                    <label for="nom" class="mt-4 block font-semibold">Nom</label>

                    <input type="text" id="nom" name="nom" required

                        class="mt-1 w-full rounded-md border border-slate-300 p-2 focus:outline-none focus:ring-4 focus:ring-amber-400">



                    <label for="email" class="mt-4 block font-semibold">Adresse e-mail</label>

                    <input type="email" id="email" name="email" required

                        class="mt-1 w-full rounded-md border border-slate-300 p-2 focus:outline-none focus:ring-4 focus:ring-amber-400">



                    <label for="message" class="mt-4 block font-semibold">Message</label>

                    <textarea id="message" name="message" rows="5" required

                        class="mt-1 w-full rounded-md border border-slate-300 p-2 focus:outline-none focus:ring-4 focus:ring-amber-400"></textarea>



                    <button type="submit"

                        class="mt-5 rounded-md bg-indigo-700 px-5 py-3 font-semibold text-white hover:bg-indigo-800 focus:outline-none focus:ring-4 focus:ring-amber-400">Envoyer</button>

                </form>

            </section>



            <section class="rounded-xl border-l-4 border-amber-500 bg-white p-6 shadow">

                <h2 class="border-b border-amber-100 pb-2 text-xl font-semibold text-slate-900">Coordonnées</h2>

                <address class="mt-4 space-y-2 not-italic">

                    <p>Email : <a href="mailto:abcd@def.com" class="text-indigo-700 underline">abcd@def.com</a></p>

                    <p>Téléphone : <a href="tel:+9945968785" class="text-indigo-700 underline">99 45 96 87 85</a></p>

                

                    <p>Mobilité : Paris,Marseille </p>

                </address>

            </section>

        </div>

    </main>



    <footer class="p-6 text-center text-sm text-slate-500">

        <p>© 2026 Kilyan Thirard · <a href="contact.html" class="underline">Contact</a> · <a href="#main-header" class="underline">Haut de page</a></p>

    </footer>

</body>

</html>
